<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Millie's 在线默写系统 (终极完全体)</title>
    <style>
        :root {
            --bg: #121212; --card-bg: #1e1e1e; --text: #e0e0e0;
            --primary: #4caf50; --error: #f44336; --warning: #ff9800; --border: #333;
            --teacher: #0071e3;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        h1 { margin-top: 20px; font-size: 24px; color: #fff; text-align: center; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 20px; text-align: center; }

        .layout { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 700px; }

        /* 登入/验证区 */
        .login-container { background-color: var(--card-bg); padding: 40px 30px; border-radius: 16px; border: 1px solid var(--border); width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .login-container input, .login-container select { width: 100%; padding: 15px; border-radius: 8px; border: 2px solid var(--border); background-color: #121212; color: #fff; font-size: 18px; outline: none; margin-bottom: 15px; }
        .login-container input:focus, .login-container select:focus { border-color: var(--primary); }
        
        .role-select { display: flex; gap: 10px; margin-bottom: 15px; }
        .role-btn { flex: 1; padding: 10px; border: 2px solid var(--border); background: transparent; color: #888; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .role-btn.active { border-color: var(--primary); color: var(--primary); background: rgba(76, 175, 80, 0.1); }

        /* 通用容器 */
        .quiz-container, .teacher-container { display: none; background-color: var(--card-bg); padding: 30px; border-radius: 16px; border: 1px solid var(--border); width: 100%; }
        
        .question { font-size: 22px; font-weight: bold; margin-bottom: 20px; text-align: center; color: #fff; }
        .input-group { display: flex; flex-direction: column; gap: 15px; }
        input[type="text"], input[type="password"], textarea { width: 100%; padding: 15px; border-radius: 8px; border: 2px solid var(--border); background-color: #121212; color: #fff; font-size: 16px; outline: none; font-family: inherit; }
        input[type="text"]:focus, input[type="password"]:focus, textarea:focus { border-color: var(--primary); }
        textarea { resize: vertical; min-height: 120px; line-height: 1.5; }
        
        button { padding: 15px; border-radius: 8px; border: none; background-color: var(--primary); color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover { opacity: 0.8; }
        
        .feedback { margin-top: 15px; font-size: 16px; text-align: center; min-height: 24px; font-weight: bold; line-height: 1.5; }
        .correct { color: var(--primary); } .wrong { color: var(--error); } .skip { color: var(--warning); }
        
        .progress-bar { width: 100%; height: 6px; background-color: #333; border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
        .progress-fill { height: 100%; background-color: var(--primary); width: 0%; transition: width 0.3s; }

        /* 排行榜 */
        .leaderboard { background-color: var(--card-bg); padding: 20px; border-radius: 16px; width: 100%; border: 1px solid var(--border); }
        .leaderboard h2 { font-size: 18px; text-align: center; margin-bottom: 15px; color: #ffca28; }
        .rank-list { list-style: none; padding: 0; }
        .rank-list li { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid var(--border); font-size: 16px; }
        .rank-list li:last-child { border-bottom: none; }
        .rank-score { color: var(--primary); font-weight: bold; font-size: 18px; }

        /* ======= 教师端 UI ======= */
        .teacher-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .teacher-header h2 { color: var(--teacher); margin: 0; }
        
        /* 大厅界面 */
        .lobby-box { background: #252525; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .lobby-box h3 { margin-bottom: 15px; color: #fff; font-size: 16px; }
        
        /* 滑动列表容器 */
        .list-container {
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 15px;
            background: #1a1a1a;
        }
        
        .list-item {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .list-item:hover { background: #333; }
        .list-item.active { background: rgba(0, 113, 227, 0.2); border-left: 4px solid var(--teacher); }
        
        /* 自定义滚动条 */
        .list-container::-webkit-scrollbar { width: 8px; }
        .list-container::-webkit-scrollbar-track { background: #121212; }
        .list-container::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        .list-container::-webkit-scrollbar-thumb:hover { background: #555; }

        .btn-row { display: flex; gap: 10px; }
        .btn-enter { flex: 1; background-color: var(--teacher); }
        .btn-icon { padding: 10px 15px; font-size: 18px; background-color: #444; }
        .btn-icon:hover { background-color: #555; }
        .btn-del-icon { background-color: #4a1c1c; color: #f44336; }
        .btn-del-icon:hover { background-color: #6b2626; }
        
        /* 编辑界面 */
        .editor-header { display: flex; justify-content: space-between; align-items: center; background: #252525; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .editor-title { font-size: 18px; font-weight: bold; color: var(--teacher); }
        .btn-back { background-color: #444; padding: 10px 15px; font-size: 14px; }

        .edit-row { display: flex; gap: 10px; margin-bottom: 10px; background: #2a2a2a; padding: 10px; border-radius: 8px; align-items: center; }
        .edit-row input { margin-bottom: 0; padding: 10px; font-size: 14px; }
        .edit-row .edit-cn { flex: 1; }
        .edit-row .edit-en { flex: 1.5; }
        .btn-del { background-color: var(--error); padding: 8px 12px; font-size: 14px; }
        
        .btn-add { background-color: #444; width: 100%; margin-bottom: 15px; border: 1px dashed #888; }
        .btn-add:hover { background-color: #555; }
        
        .bulk-area { border: 1px solid var(--teacher); padding: 15px; border-radius: 8px; margin-bottom: 20px; background: rgba(0, 113, 227, 0.05); }
        .bulk-area h3 { font-size: 15px; color: var(--teacher); margin-bottom: 10px; }
        
        .btn-parse { background-color: var(--teacher); width: 100%; margin-top: 10px; }
        .btn-save { background-color: var(--teacher); width: 100%; padding: 18px; font-size: 18px; margin-top: 15px; }
        .btn-logout { background-color: transparent; border: 1px solid #555; color: #aaa; padding: 8px 15px; }
    </style>
</head>
<body>

    <h1>Millie's 在线默写系统</h1>
    <div class="subtitle">师生互动 · 批量导入 · 单元管理</div>

    <div class="layout">
        <!-- 登入界面 -->
        <div class="login-container" id="login-area">
            <h2>请选择身份登入</h2>
            <div class="role-select">
                <button class="role-btn active" id="btn-role-student" onclick="setRole('student')">👨‍🎓 学生</button>
                <button class="role-btn" id="btn-role-teacher" onclick="setRole('teacher')">👩‍🏫 教师</button>
            </div>
            <input type="text" id="player-name" placeholder="输入名字..." autocomplete="off">
            
            <div id="student-list-container" style="display: block;">
                <select id="student-list-select">
                    <option value="">加载词单中...</option>
                </select>
            </div>
            
            <div id="teacher-pass-container" style="display: none;">
                <input type="password" id="teacher-password" placeholder="请输入教师密码...">
            </div>

            <button onclick="login()" id="login-btn">进入系统</button>
        </div>

        <!-- 学生答题区 -->
        <div class="quiz-container" id="quiz-area">
            <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
            <div class="question" id="question-text">Loading...</div>
            <div class="input-group">
                <input type="text" id="answer-input" placeholder="输入英文..." autocomplete="off" spellcheck="false">
                <button onclick="handleBtnClick()" id="submit-btn">提交答案 (回车)</button>
            </div>
            <div class="feedback" id="feedback-text"></div>
        </div>

        <!-- 教师端 -->
        <div class="teacher-container" id="teacher-area">
            <div class="teacher-header">
                <h2>👩‍🏫 教师控制台</h2>
                <button class="btn-logout" onclick="location.reload()">退出</button>
            </div>
            
            <!-- 阶段1：词单大厅 -->
            <div id="teacher-lobby">
                <div class="lobby-box">
                    <h3>管理已有词单：</h3>
                    
                    <!-- 滑动列表容器 -->
                    <div class="list-container" id="teacher-list-container">
                        <!-- 动态生成列表项 -->
                    </div>

                    <div class="btn-row">
                        <button class="btn-enter" onclick="enterList()">进入选中词单</button>
                        <button class="btn-icon" onclick="renameList()" title="修改名字">✏️</button>
                        <button class="btn-icon btn-del-icon" onclick="deleteList()" title="删除词单">🗑️</button>
                    </div>
                </div>
                
                <div class="lobby-box">
                    <h3>创建新词单：</h3>
                    <input type="text" id="new-list-name" placeholder="输入新词单名 (如: Unit 1)" style="margin-bottom: 15px;">
                    <button class="btn-enter" style="background-color: var(--warning); width: 100%;" onclick="createNewList()" id="btn-create-list">➕ 创建新词单</button>
                </div>
                <div class="feedback" id="lobby-feedback"></div>
            </div>

            <!-- 阶段2：词单编辑区 -->
            <div id="teacher-editor" style="display: none;">
                <div class="editor-header">
                    <div class="editor-title" id="current-list-title">Unit 1</div>
                    <button class="btn-back" onclick="backToLobby()">↩ 返回大厅</button>
                </div>

                <div class="bulk-area">
                    <h3>📋 批量粘贴区</h3>
                    <p style="font-size: 12px; color: #aaa; margin-bottom: 8px;">格式示例：facility - 设施/设备</p>
                    <textarea id="bulk-input" placeholder="在这里粘贴单词..."></textarea>
                    <button class="btn-parse" onclick="parseBulk()">⚡ 智能解析并追加</button>
                </div>

                <div id="editor-list" style="max-height: 400px; overflow-y: auto;">
                    <!-- 动态生成输入框 -->
                </div>
                
                <button class="btn-add" onclick="addEditRow()">➕ 手动增加一题</button>
                <button class="btn-save" onclick="saveQuestions()">💾 保存当前词单</button>
                <div class="feedback" id="teacher-feedback"></div>
            </div>
        </div>

        <!-- 排行榜区 -->
        <div class="leaderboard">
            <h2 id="board-title">👥 挑战者状态</h2>
            <ul class="rank-list" id="rank-list">
                <li><span>等待玩家加入...</span></li>
            </ul>
        </div>
    </div>

    <script>
        // ================= 配置区 =================
        // ⚠️⚠️⚠️ 必须换成你真实的 JSONBIN 配置 ⚠️⚠️⚠️
        const JSONBIN_KEY = "$2a$10$DCXVGO/cu6LJhWXN65Ylb.iDRAKebWx4jcaTm6yyikEkMJChyxovW"; 
        const JSONBIN_BIN_ID = "6ae2c0feac6210605a5ade70"; 
        
        const API_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;
        const HEADERS = { "Content-Type": "application/json", "X-Master-Key": JSONBIN_KEY };

        const TEACHER_PASSWORD = "alevelchinese";

        let currentRole = 'student'; 
        let vocabulary = []; 
        let currentIndex = 0;
        let score = 0;
        let isAnswered = false;
        let playerName = "";
        let playerId = "player_" + Math.floor(Math.random() * 1000000);
        
        let cloudData = {}; 
        let allLists = {};  
        let currentTeacherListId = ""; 
        let selectedListIdForUI = ""; // 记录老师在列表中选中的项

        function setRole(role) {
            currentRole = role;
            document.getElementById('btn-role-student').classList.remove('active');
            document.getElementById('btn-role-teacher').classList.remove('active');
            document.getElementById(`btn-role-${role}`).classList.add('active');
            document.getElementById('student-list-container').style.display = role === 'student' ? 'block' : 'none';
            document.getElementById('teacher-pass-container').style.display = role === 'teacher' ? 'block' : 'none';
            document.getElementById('player-name').placeholder = role === 'student' ? "输入学生名字..." : "输入教师名字...";
        }

        async function fetchCloudData() {
            try {
                const res = await fetch(`${API_URL}/latest`, { headers: HEADERS });
                const json = await res.json();
                let record = json.record;

                if (!record || typeof record !== 'object' || Array.isArray(record)) record = {};
                cloudData = record;
                if (!cloudData.lists || typeof cloudData.lists !== 'object' || Array.isArray(cloudData.lists)) cloudData.lists = {};
                
                allLists = cloudData.lists; 
                return true;
            } catch (e) { return false; }
        }

        window.onload = async () => {
            await fetchCloudData();
            updateStudentDropdown();
        }

        function updateStudentDropdown() {
            const select = document.getElementById('student-list-select');
            select.innerHTML = "";
            const listIds = Object.keys(allLists);
            
            if (listIds.length === 0) {
                select.innerHTML = "<option value=''>暂无词单（等老师创建）</option>";
                return;
            }
            listIds.forEach(id => {
                const option = document.createElement('option');
                option.value = id;
                option.textContent = allLists[id].name;
                select.appendChild(option);
            });
        }

        async function login() {
            let name = document.getElementById('player-name').value.trim();
            if (name === '') { alert("请输入名字！"); return; }
            
            if (currentRole === 'teacher') {
                let pass = document.getElementById('teacher-password').value;
                if (pass !== TEACHER_PASSWORD) { alert("密码错误！"); return; }
            }

            playerName = name;
            document.getElementById('login-area').style.display = 'none';

            if (currentRole === 'teacher') {
                document.getElementById('teacher-area').style.display = 'block';
                await fetchCloudData();
                renderTeacherLobby();
            } else {
                const selectedListId = document.getElementById('student-list-select').value;
                if (!selectedListId) { alert("请选择词单！"); return; }
                
                document.getElementById('quiz-area').style.display = 'block';
                vocabulary = allLists[selectedListId].words || [];
                
                if (vocabulary.length === 0) {
                    document.getElementById('question-text').textContent = "这个词单里还没有单词哦...";
                    return;
                }
                document.getElementById('question-text').textContent = vocabulary[0].cn;
                document.getElementById('answer-input').focus();
                updateCloudStatus("答题中...", false, selectedListId);
            }
        }

        // ================= 教师端大厅逻辑 =================

        function renderTeacherLobby() {
            document.getElementById('teacher-lobby').style.display = 'block';
            document.getElementById('teacher-editor').style.display = 'none';
            
            const container = document.getElementById('teacher-list-container');
            container.innerHTML = "";
            const listIds = Object.keys(allLists);
            
            if (listIds.length === 0) {
                container.innerHTML = "<div style='padding: 20px; text-align: center; color: #888;'>暂无词单</div>";
                selectedListIdForUI = "";
                return;
            }

            listIds.forEach(id => {
                const div = document.createElement('div');
                div.className = 'list-item';
                if (id === selectedListIdForUI) div.classList.add('active');
                div.textContent = allLists[id].name;
                div.onclick = () => {
                    selectedListIdForUI = id;
                    renderTeacherLobby(); // 重新渲染以更新高亮
                };
                container.appendChild(div);
            });
        }

        async function createNewList() {
            let name = document.getElementById('new-list-name').value.trim();
            if (!name) { alert("请输入词单名字！"); return; }

            const btn = document.getElementById('btn-create-list');
            btn.textContent = "保存中...";
            btn.disabled = true; // 锁死按钮，绝对防止连点覆盖

            await fetchCloudData();
            
            const id = "list_" + Date.now();
            cloudData.lists[id] = { name: name, words: [] };
            
            try {
                await pushToCloud(cloudData);
                
                document.getElementById('new-list-name').value = '';
                document.getElementById('lobby-feedback').textContent = `✅ 成功创建词单：${name}`;
                document.getElementById('lobby-feedback').className = "feedback correct";
                
                allLists = cloudData.lists;
                selectedListIdForUI = id; // 自动选中刚建好的
                renderTeacherLobby(); 
                updateStudentDropdown();
            } catch (e) {
                alert("网络错误，创建失败。请检查你的 JSONBIN_KEY！");
            }

            btn.textContent = "➕ 创建新词单";
            btn.disabled = false;
        }

        async function renameList() {
            if (!selectedListIdForUI) { alert("请先在列表中点击选择一个词单！"); return; }

            const oldName = allLists[selectedListIdForUI].name;
            const newName = prompt(`请输入新的词单名字（原名字：${oldName}）：`, oldName);
            
            if (newName && newName.trim() !== "" && newName !== oldName) {
                await fetchCloudData();
                cloudData.lists[selectedListIdForUI].name = newName.trim();
                await pushToCloud(cloudData);
                
                document.getElementById('lobby-feedback').textContent = `✅ 词单已重命名为：${newName}`;
                document.getElementById('lobby-feedback').className = "feedback correct";
                
                allLists = cloudData.lists;
                renderTeacherLobby();
                updateStudentDropdown();
            }
        }

        async function deleteList() {
            if (!selectedListIdForUI) { alert("请先在列表中点击选择一个词单！"); return; }

            const listName = allLists[selectedListIdForUI].name;
            const confirmDelete = confirm(`⚠️ 警告：你确定要彻底删除词单【${listName}】吗？\n里面的所有单词也会被清空，且无法恢复！`);
            
            if (confirmDelete) {
                await fetchCloudData();
                delete cloudData.lists[selectedListIdForUI];
                
                if (cloudData.players && cloudData.players[selectedListIdForUI]) {
                    delete cloudData.players[selectedListIdForUI];
                }
                
                await pushToCloud(cloudData);
                
                document.getElementById('lobby-feedback').textContent = `🗑️ 词单已删除。`;
                document.getElementById('lobby-feedback').className = "feedback skip";
                
                allLists = cloudData.lists;
                selectedListIdForUI = ""; // 清空选中
                renderTeacherLobby();
                updateStudentDropdown();
            }
        }

        function enterList() {
            if (!selectedListIdForUI) { alert("请先在列表中点击选择一个词单！"); return; }
            
            currentTeacherListId = selectedListIdForUI;
            document.getElementById('teacher-lobby').style.display = 'none';
            document.getElementById('teacher-editor').style.display = 'block';
            document.getElementById('current-list-title').textContent = allLists[currentTeacherListId].name;
            
            const words = allLists[currentTeacherListId].words || [];
            document.getElementById('editor-list').innerHTML = '';
            words.forEach(q => {
                let enStr = Array.isArray(q.en) ? q.en.join(" / ") : q.en;
                addEditRow(q.cn, enStr);
            });
            document.getElementById('teacher-feedback').textContent = "";
        }

        function backToLobby() {
            document.getElementById('teacher-lobby').style.display = 'block';
            document.getElementById('teacher-editor').style.display = 'none';
            document.getElementById('lobby-feedback').textContent = "";
            renderTeacherLobby(); // 刷新列表确保状态最新
        }

        // ================= 教师端编辑逻辑 =================

        // 核心修复：修改 addEditRow 让其返回创建的 DOM，以便我们后续控制
        function addEditRow(cn = "", en = "") {
            const list = document.getElementById('editor-list');
            const row = document.createElement('div');
            row.className = 'edit-row';
            row.innerHTML = `
                <input type="text" class="edit-cn" placeholder="中文提示" value="${cn}">
                <input type="text" class="edit-en" placeholder="英文答案" value="${en}">
                <button class="btn-del" onclick="this.parentElement.remove()">🗑️</button>
            `;
            list.appendChild(row);
            return row; // 返回这一行
        }

        function parseBulk() {
            const text = document.getElementById('bulk-input').value;
            if (!text.trim()) return;
            const lines = text.split('\n');
            let parsedCount = 0;

            lines.forEach(line => {
                line = line.trim();
                if (!line) return;
                let parts = line.split(/[-,\t:|，]/);
                if (parts.length >= 2) {
                    let p1 = parts[0].trim();
                    let p2 = parts[1].trim();
                    
                    // 智能判断中英文
                    if (/[\u4e00-\u9fa5]/.test(p1)) { 
                        addEditRow(p1, p2); 
                    } else { 
                        addEditRow(p2, p1); 
                    }
                    parsedCount++;
                }
            });
            
            document.getElementById('bulk-input').value = '';
            document.getElementById('teacher-feedback').textContent = `✅ 成功解析并添加了 ${parsedCount} 道题目，请点击下方保存！`;
            document.getElementById('teacher-feedback').className = "feedback correct";
        }

        async function saveQuestions() {
            if (!currentTeacherListId) return;

            const rows = document.querySelectorAll('.edit-row');
            let newQuestions = [];
            rows.forEach(row => {
                let cn = row.querySelector('.edit-cn').value.trim();
                let enStr = row.querySelector('.edit-en').value.trim();
                if(cn && enStr) {
                    let enArray = enStr.split('/').map(item => item.trim()).filter(item => item);
                    newQuestions.push({ cn: cn, en: enArray });
                }
            });

            await fetchCloudData(); 
            cloudData.lists[currentTeacherListId].words = newQuestions;
            
            await pushToCloud(cloudData);
            
            document.getElementById('teacher-feedback').textContent = "✅ 词单保存成功！";
            document.getElementById('teacher-feedback').className = "feedback correct";
            updateStudentDropdown();
        }

        async function pushToCloud(data) {
            await fetch(API_URL, { method: 'PUT', headers: HEADERS, body: JSON.stringify(data) });
        }

        // ================= 学生端答题逻辑 =================
        function handleBtnClick() { checkAnswer(); }
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && currentRole === 'student' && document.getElementById('quiz-area').style.display === 'block') {
                e.preventDefault(); checkAnswer();
            }
        });

        function checkAnswer() {
            if (isAnswered) {
                currentIndex++;
                if(currentIndex < vocabulary.length) { loadNext(); } else { endGame(); }
                return;
            }
            const userAnswer = document.getElementById('answer-input').value.trim().toLowerCase();
            const correctAnswers = vocabulary[currentIndex].en.map(a => a.toLowerCase());
            const submitBtn = document.getElementById('submit-btn');

            isAnswered = true;
            document.getElementById('answer-input').disabled = true;
            submitBtn.textContent = '下一题 (回车)';
            let fb = document.getElementById('feedback-text');

            if (userAnswer === '') {
                fb.innerHTML = `⚠️ 跳过。正确答案：<br><span style="color: #fff">${vocabulary[currentIndex].en.join(' / ')}</span>`;
                fb.className = "feedback skip";
            } else if (correctAnswers.includes(userAnswer)) {
                score++;
                fb.innerHTML = "✅ 正确！";
                fb.className = "feedback correct";
            } else {
                fb.innerHTML = `❌ 错误。正确答案：<br><span style="color: #fff">${vocabulary[currentIndex].en.join(' / ')}</span>`;
                fb.className = "feedback wrong";
            }
        }

        function loadNext() {
            isAnswered = false;
            document.getElementById('answer-input').value = '';
            document.getElementById('answer-input').disabled = false;
            document.getElementById('answer-input').focus();
            document.getElementById('feedback-text').textContent = '';
            document.getElementById('submit-btn').textContent = '提交答案 (回车)';
            document.getElementById('question-text').textContent = vocabulary[currentIndex].cn;
            document.getElementById('progress-fill').style.width = `${(currentIndex / vocabulary.length) * 100}%`;
        }

        function endGame() {
            document.getElementById('quiz-area').style.display = 'none';
            document.getElementById('result-area').style.display = 'block';
            document.getElementById('my-final-score').textContent = `${score} / ${vocabulary.length}`;
            const selectedListId = document.getElementById('student-list-select').value;
            updateCloudStatus("已交卷", true, selectedListId);
        }

        // ================= 排行榜交互 =================
        async function updateCloudStatus(statusText, showScore, listId) {
            try {
                await fetchCloudData();
                cloudData.players = cloudData.players || {};
                cloudData.players[listId] = cloudData.players[listId] || {};
                cloudData.players[listId][playerId] = { name: playerName, score: score, status: statusText, show: showScore };
                await pushToCloud(cloudData);
                renderLeaderboard();
            } catch (e) {}
        }

        function renderLeaderboard() {
            const list = document.getElementById('rank-list');
            if (!list) return;
            list.innerHTML = '';
            
            const selectedListId = document.getElementById('student-list-select').value;
            const playersDict = (cloudData.players && cloudData.players[selectedListId]) ? cloudData.players[selectedListId] : {};
            let players = Object.values(playersDict);

            if (players.length === 0) {
                list.innerHTML = '<li><span>等待玩家加入...</span></li>';
                return;
            }

            const allFinished = players.every(p => p.status === "已交卷");
            if (allFinished) {
                document.getElementById('board-title').textContent = "🏆 最终排行榜";
                players.sort((a, b) => b.score - a.score);
                players.forEach((p, index) => {
                    const li = document.createElement('li');
                    let medal = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : `${index + 1}.`;
                    li.innerHTML = `<span>${medal} ${p.name}</span> <span class="rank-score">${p.score}分</span>`;
                    list.appendChild(li);
                });
            } else {
                document.getElementById('board-title').textContent = "👥 挑战者状态";
                players.forEach(p => {
                    const li = document.createElement('li');
                    li.innerHTML = `<span>${p.name}</span> <span style="color:#888;">${p.status}</span>`;
                    list.appendChild(li);
                });
            }
        }

        setInterval(async () => {
            if (!playerName || currentRole === 'teacher') return;
            try {
                const res = await fetch(`${API_URL}/latest`, { headers: HEADERS });
                const json = await res.json();
                if(json.record) {
                    cloudData = json.record;
                    renderLeaderboard();
                }
            } catch (e) {}
        }, 3000);
    </script>
</body>
</html>
